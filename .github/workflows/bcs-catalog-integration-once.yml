name: one-time BCS catalog integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: macos-15-intel
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6 requests pyinstaller

      - name: Integrate exact BCS catalog
        run: python scripts/integrate_bcs_catalog_once.py

      - name: Compile Python sources
        run: python -m compileall -q Program

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build macOS application
        run: ./scripts/build_mac_app.sh

      - name: Commit integrated scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program/services/futures_oi_marketdata_scanner_service.py
          git rm scripts/integrate_bcs_catalog_once.py .github/workflows/bcs-catalog-integration-once.yml
          git commit -m "Integrate exact BCS underlying catalog" || exit 0
          git push origin HEAD:main
