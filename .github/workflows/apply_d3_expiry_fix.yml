name: Apply MOEX D-3 expiry rollover fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Program/services/open_interest_service.py')
          s = p.read_text()
          s = s.replace(
              '    FUTURES_MARKETDATA_ALL_URL = f"{FUTURES_MARKETDATA_URL}.json?iss.only=marketdata"\n    VERSION = "1.4.2"',
              '    FUTURES_MARKETDATA_ALL_URL = f"{FUTURES_MARKETDATA_URL}.json?iss.only=marketdata"\n    FUTURES_EXPIRY_CALENDAR_URL = "https://iss.moex.com/iss/calendars/futures/securities.json"\n    ROLLOVER_DAYS_BEFORE_EXPIRY = 3\n    VERSION = "1.5.0"',
          )
          s = s.replace(
              '        self._marketdata_all_cache = None\n',
              '        self._marketdata_all_cache = None\n        self._expiry_calendar_cache = {}\n',
          )

          start = s.index('    @classmethod\n    def _marketdata_expiry(')
          end = s.index('    @classmethod\n    def _front_marketdata_rows', start)
          new = '''    @classmethod\n    def _marketdata_expiry(cls, secid, as_of=None):\n        """Legacy SECID month/year fallback for non-selection callers only."""\n        secid = str(secid or "").strip().upper()\n        if not secid:\n            return date.max\n        if "-" in secid:\n            tail = secid.rsplit("-", 1)[1]\n            if "." in tail:\n                month_s, year_s = tail.split(".", 1)\n                if month_s.isdigit() and year_s.isdigit():\n                    try:\n                        year, month = 2000 + int(year_s), int(month_s)\n                        return date(year, month, calendar.monthrange(year, month)[1])\n                    except ValueError:\n                        pass\n        if len(secid) >= 3 and secid[-2] in cls.MONTH_CODES and secid[-1].isdigit():\n            digit, month = int(secid[-1]), cls.MONTH_CODES[secid[-2]]\n            reference_year = as_of.year if isinstance(as_of, date) else date.today().year\n            decade = (reference_year // 10) * 10\n            candidates = [decade - 10 + digit, decade + digit, decade + 10 + digit]\n            year = min(candidates, key=lambda candidate: abs(candidate - reference_year))\n            return date(year, month, calendar.monthrange(year, month)[1])\n        return date.max\n\n    def _load_expiry_calendar(self, as_of):\n        """Load exact contract expiration from the official MOEX machine-readable calendar."""\n        if isinstance(as_of, datetime):\n            as_of = as_of.date()\n        key = as_of.isoformat()\n        if key in self._expiry_calendar_cache:\n            return dict(self._expiry_calendar_cache[key])\n        try:\n            payload = self._http_get(\n                f"{self.FUTURES_EXPIRY_CALENDAR_URL}?{urlencode({'from': key, 'till': key})}",\n                timeout=self.TIMEOUT,\n            )\n        except Exception:\n            self._expiry_calendar_cache[key] = {}\n            return {}\n        securities = payload.get("securities") if isinstance(payload, dict) else None\n        forts = securities.get("forts") if isinstance(securities, dict) else None\n        if not isinstance(forts, dict):\n            forts = payload.get("forts") if isinstance(payload, dict) else None\n        if not isinstance(forts, dict):\n            self._expiry_calendar_cache[key] = {}\n            return {}\n        columns = [str(x).lower() for x in forts.get("columns", [])]\n        result = {}\n        data = forts.get("data", [])\n        for row in data if isinstance(data, list) else []:\n            if not isinstance(row, list):\n                continue\n            item = dict(zip(columns, row))\n            secid = str(item.get("secid") or item.get("symbol") or "").strip().upper()\n            raw = str(item.get("expiration_date") or "").strip()[:10]\n            if not secid or not raw:\n                continue\n            try:\n                result[secid] = date.fromisoformat(raw)\n            except ValueError:\n                continue\n        self._expiry_calendar_cache[key] = result\n        return dict(result)\n\n    def _exact_marketdata_expiry(self, secid, as_of):\n        return self._load_expiry_calendar(as_of).get(str(secid or "").strip().upper())\n\n    def _marketdata_candidates(self, rows, as_of):\n        if isinstance(as_of, datetime):\n            as_of = as_of.date()\n        grouped = {}\n        for row in rows:\n            if not isinstance(row, dict):\n                continue\n            secid = str(row.get("secid") or row.get("ticker") or "").upper().strip()\n            family = self._marketdata_family(secid)\n            oi = self._number(row.get("openposition"))\n            if not secid or not family or oi <= 0:\n                continue\n            expiry = self._exact_marketdata_expiry(secid, as_of)\n            if expiry is None or expiry < as_of:\n                continue\n            grouped.setdefault(family, []).append((expiry, secid, row))\n        for candidates in grouped.values():\n            candidates.sort(key=lambda item: (item[0], item[1]))\n        return grouped\n\n'''
          s = s[:start] + new + s[end:]

          start = s.index('    @classmethod\n    def _front_marketdata_rows')
          end = s.index('    def marketdata_front_contracts', start)
          new = '''    def _front_marketdata_rows(self, rows, as_of=None):\n        """Select the effective working contract using the exact MOEX D-3 rule."""\n        as_of = as_of or date.today()\n        if isinstance(as_of, datetime):\n            as_of = as_of.date()\n        grouped = self._marketdata_candidates(rows, as_of)\n        selected = {}\n        for family, candidates in grouped.items():\n            front_expiry, front_secid, _ = candidates[0]\n            days_to_expiry = (front_expiry - as_of).days\n            rollover_active = days_to_expiry <= self.ROLLOVER_DAYS_BEFORE_EXPIRY\n            if rollover_active:\n                if len(candidates) < 2:\n                    continue\n                expiry, secid, row = candidates[1]\n                role = "NEXT"\n            else:\n                expiry, secid, row = candidates[0]\n                role = "FRONT"\n            item = dict(row)\n            item["_moex_family"] = family\n            item["_moex_expiry"] = expiry.isoformat()\n            item["_moex_front_contract"] = front_secid\n            item["_moex_rollover_active"] = rollover_active\n            item["_moex_rollover_days_to_expiry"] = days_to_expiry\n            item["_moex_contract_role"] = role\n            selected[family] = item\n        return selected\n\n'''
          s = s[:start] + new + s[end:]

          start = s.index('    def marketdata_curve_contracts')
          end = s.index('    def _request_marketdata_family', start)
          new = '''    def marketdata_curve_contracts(self, as_of=None):\n        """Return exact-MOEX-expiry FRONT/NEXT contracts for rollover diagnostics."""\n        as_of = as_of or date.today()\n        if isinstance(as_of, datetime):\n            as_of = as_of.date()\n        grouped = self._marketdata_candidates(self._load_marketdata_all(), as_of)\n        result = {}\n        for family, candidates in grouped.items():\n            curve = {}\n            for rank, (expiry, secid, row) in enumerate(candidates[:2], start=1):\n                item = dict(row)\n                item["_moex_family"] = family\n                item["_moex_expiry"] = expiry.isoformat()\n                item["_moex_curve_rank"] = rank\n                item["_moex_curve_role"] = "FRONT" if rank == 1 else "NEXT"\n                curve["front" if rank == 1 else "next"] = item\n            if "front" in curve:\n                result[family] = curve\n        return result\n\n'''
          s = s[:start] + new + s[end:]

          p.write_text(s)
          PY

      - name: Add regression tests and run full suite
        run: |
          cat > Program/test_open_interest_d3_rollover.py <<'PY'
          from datetime import date
          from services.open_interest_service import OpenInterestService

          def row(secid, oi=100):
              return {"secid": secid, "openposition": oi}

          def service():
              svc = OpenInterestService(http_get=lambda *args, **kwargs: {})
              svc._expiry_calendar_cache["2026-09-14"] = {
                  "SIU6": date(2026, 9, 17),
                  "SIZ6": date(2026, 12, 17),
              }
              return svc

          def test_d4_front():
              selected = service()._front_marketdata_rows([row("SIU6"), row("SIZ6")], date(2026, 9, 13))
              assert selected["SI"]["secid"] == "SIU6"
              assert selected["SI"]["_moex_contract_role"] == "FRONT"

          def test_d3_next():
              selected = service()._front_marketdata_rows([row("SIU6"), row("SIZ6")], date(2026, 9, 14))
              assert selected["SI"]["secid"] == "SIZ6"
              assert selected["SI"]["_moex_contract_role"] == "NEXT"

          def test_d2_next():
              selected = service()._front_marketdata_rows([row("SIU6"), row("SIZ6")], date(2026, 9, 15))
              assert selected["SI"]["secid"] == "SIZ6"

          def test_no_fallback_without_next_oi():
              selected = service()._front_marketdata_rows([row("SIU6"), row("SIZ6", 0)], date(2026, 9, 14))
              assert "SI" not in selected
          PY
          PYTHONPATH=Program python3 -m py_compile Program/services/open_interest_service.py Program/test_open_interest_d3_rollover.py
          PYTHONPATH=Program pytest -q
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program/services/open_interest_service.py Program/test_open_interest_d3_rollover.py
          git commit -m 'Use official MOEX expiry calendar for D-3 rollover'
          git push

      - name: Remove temporary D-3 workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply_d3_expiry_fix.yml .github/workflows/repair_d3_expiry_fix.yml D3_FIX_TRIGGER.md
          git commit -m 'Remove temporary D-3 repair automation'
          git push
