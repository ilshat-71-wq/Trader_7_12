name: One-time futures OI primary-source upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('Program/services/futures_oi_scanner_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('VERSION = "2.4.0"', 'VERSION = "2.5.0"', 1)

          method = textwrap.dedent('''
          def scan(self, as_of=None):
              as_of = as_of or date.today()
              if not self.api.access_token and not self.api.authorize():
                  return [], {"status": "BCS_AUTH_FAILED", "version": self.VERSION}

              contracts = self._active_contracts()
              underlying_quotes = self._underlying_quotes(contracts)
              results, skipped, oi_available = [], 0, 0
              marketdata_rows = 0
              marketdata_oi_rows = 0

              for contract in contracts:
                  root = str(contract.get("oi_root") or "").upper()
                  if not root:
                      skipped += 1
                      continue

                  marketdata = self.oi._request_marketdata_family(root)
                  if not marketdata:
                      skipped += 1
                      continue
                  marketdata_rows += 1

                  last = self._float(marketdata, "last", "lastPrice", "price", "currentPrice")
                  change = self._float(marketdata, "lasttoprevprice", "lastChangePrcnt", "lastChangePercent")
                  if change is None:
                      previous = self._float(marketdata, "prevprice", "prevSettlePrice", "prevsettleprice", "lastSettlPrice")
                      if last is not None and previous and previous > 0:
                          change = (last / previous - 1.0) * 100.0
                  if last is None or change is None:
                      skipped += 1
                      continue

                  volume = self._float(marketdata, "voltoday", "volume", "volumeContracts", "totalVolume")
                  oi = self.oi._marketdata_analysis(None, root, change, None)
                  if oi and oi.get("oi_status") in {"AVAILABLE", "CURRENT_ONLY"}:
                      oi_available += 1
                      marketdata_oi_rows += 1
                  if not oi:
                      oi = {"oi_status": "UNAVAILABLE", "oi_source": "NONE", "oi_root": root}

                  moex_contract = self._text(marketdata, "secid", "ticker", "securityCode") or contract.get("futures_ticker")
                  contract_row = dict(contract)
                  contract_row.update({
                      "futures_ticker": moex_contract,
                      "futures_ticker_normalized": str(moex_contract or "").upper(),
                      "futures_class_code": "RFUD",
                      "curve_role": "FRONT",
                      "price": last,
                      "change_percent": round(change, 4),
                      "volume": volume,
                  })

                  underlying_ticker = str(contract_row.get("underlying_ticker") or "").upper()
                  underlying_quote = underlying_quotes.get(underlying_ticker, {})
                  underlying_price = self._float(underlying_quote, "lastPrice", "last", "price", "currentPrice", "close")
                  underlying_open = self._float(underlying_quote, "openPrice", "open", "dayOpen", "openingPrice")
                  underlying_change = (
                      (underlying_price / underlying_open - 1.0) * 100.0
                      if underlying_price is not None and underlying_open and underlying_open > 0
                      else None
                  )

                  row = dict(contract_row)
                  row.update({
                      "oi_analysis": oi,
                      "underlying_price": underlying_price,
                      "underlying_change_percent": None if underlying_change is None else round(underlying_change, 4),
                      "underlying_data_status": "AVAILABLE" if underlying_price is not None else "UNAVAILABLE",
                      "direction_alignment": (
                          "ALIGNED_UP" if underlying_change is not None and change > 0 and underlying_change > 0
                          else "ALIGNED_DOWN" if underlying_change is not None and change < 0 and underlying_change < 0
                          else "DIVERGENCE" if underlying_change is not None and change * underlying_change < 0
                          else "NEUTRAL"
                      ),
                      "data_status": "AVAILABLE" if oi.get("oi_status") != "UNAVAILABLE" else "OI_UNAVAILABLE",
                  })
                  results.append(row)

              results.sort(
                  key=lambda x: abs(float((x.get("oi_analysis") or {}).get("oi_change_percent") or 0.0)),
                  reverse=True,
              )
              diagnostics = dict(getattr(self, "_last_contract_diagnostics", {}))
              diagnostics.update({
                  "status": "OK",
                  "version": self.VERSION,
                  "contracts": len(contracts),
                  "analyzed": len(results),
                  "oi_available": oi_available,
                  "skipped": skipped,
                  "quote_instruments": 0,
                  "quote_records": marketdata_rows,
                  "marketdata_oi_records": marketdata_oi_rows,
                  "oi_source": "MOEX_FUTURES_MARKETDATA_PRIMARY",
                  "mapping": "BCS_UNDERLYING_TO_CANONICAL_MOEX_ROOT + MOEX_FORTS_MARKETDATA",
                  "selection_policy": "MOEX_MARKETDATA_FRONT_NONZERO_OI_PER_ROOT",
                  "marketdata_source": "MOEX_ISS_FUTURES_FORTS_RFUD",
              })
              print("Futures OI diagnostics:", diagnostics)
              return results, diagnostics
          ''').strip('\n')

          method = '\n'.join('    ' + line if line else '' for line in method.splitlines())
          pattern = r'\n    def scan\(self, as_of=None\):\n.*\Z'
          updated, count = re.subn(pattern, '\n' + method + '\n', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'scan replacement count={count}')
          path.write_text(updated, encoding='utf-8')
          PY

          cat > Program/test_futures_oi_primary_marketdata.py <<'PY'
          from services.futures_oi_scanner_service import FuturesOIScannerService


          class FakeAPI:
              access_token = "token"

              def authorize(self):
                  return True

              def get_instruments(self, instrument_type):
                  assert instrument_type == "FUTURES"
                  return [
                      {"ticker": "AFLT-9.26", "underlyingAsset": "AFLT", "classCode": "SPBFUT"},
                      {"ticker": "ALRS-9.26", "underlyingAsset": "ALRS", "classCode": "SPBFUT"},
                  ]

              def get_instruments_by_tickers(self, tickers):
                  return []


          class FakeOI:
              rows = {
                  "AF": {"secid": "AFLT-9.26", "last": 100.0, "lasttoprevprice": 2.0, "openposition": 1200, "oichange": 100},
                  "AL": {"secid": "ALRS-9.26", "last": 50.0, "lasttoprevprice": -1.0, "openposition": 800, "oichange": -40},
              }

              def _request_marketdata_family(self, root):
                  return self.rows.get(root)

              def _marketdata_analysis(self, contract_ticker, root, price_change_percent, volume_percent):
                  row = self.rows[root]
                  oi = row["openposition"]
                  oi_change = row["oichange"]
                  return {
                      "oi_status": "AVAILABLE",
                      "oi_source": "MOEX_FUTURES_MARKETDATA",
                      "oi_root": root,
                      "oi_contract_ticker": row["secid"],
                      "oi": oi,
                      "oi_change_contracts": oi_change,
                      "oi_change_percent": round(oi_change / (oi - oi_change) * 100.0, 3),
                  }


          def test_scan_uses_moex_marketdata_without_bcs_futures_quotes():
              service = FuturesOIScannerService(api=FakeAPI(), oi_service=FakeOI())
              results, diagnostics = service.scan()
              assert len(results) == 2
              assert diagnostics["oi_source"] == "MOEX_FUTURES_MARKETDATA_PRIMARY"
              assert diagnostics["oi_available"] == 2
              assert {item["futures_ticker"] for item in results} == {"AFLT-9.26", "ALRS-9.26"}


          def test_oi_change_is_separate_from_price_change():
              service = FuturesOIScannerService(api=FakeAPI(), oi_service=FakeOI())
              results, _ = service.scan()
              by_root = {item["oi_root"]: item for item in results}
              assert by_root["AF"]["change_percent"] == 2.0
              assert by_root["AF"]["oi_analysis"]["oi_change_contracts"] == 100
              assert by_root["AL"]["change_percent"] == -1.0
              assert by_root["AL"]["oi_analysis"]["oi_change_contracts"] == -40
          PY

          python3 -m py_compile Program/services/futures_oi_scanner_service.py Program/test_futures_oi_primary_marketdata.py
          python3 -m pytest -q

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Program/services/futures_oi_scanner_service.py Program/test_futures_oi_primary_marketdata.py
          git rm .github/workflows/_upgrade_futures_oi_primary.yml
          git commit -m "Use MOEX futures market data as primary OI source"
          git push origin main
