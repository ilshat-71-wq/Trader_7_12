name: macOS app build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-13
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest PySide6 requests

      - name: Build app
        run: ./scripts/build_mac_app.sh

      - name: Verify bundle provenance
        run: |
          APP='dist/Trader_7_12 Pro.app'
          test -x "$APP/Contents/MacOS/Trader_7_12_Pro"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          test "$(git rev-parse HEAD)" = "$(git rev-parse HEAD)"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/Trader_7_12 Pro.app' 'Trader_7_12_Pro_macOS.zip'

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trader_7_12_Pro_macOS
          path: Trader_7_12_Pro_macOS.zip
          if-no-files-found: error
