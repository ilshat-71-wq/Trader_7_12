name: macOS app build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-app:
    # macOS 13 was retired by GitHub. Use the current Intel runner because
    # the project is a PyInstaller macOS desktop app and must remain x86_64.
    runs-on: macos-15-intel
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest PySide6 requests

      - name: Build app
        run: ./scripts/build_mac_app.sh

      - name: Verify bundle provenance
        run: |
          APP='dist/Trader_7_12 Pro.app'
          PLIST="$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/Trader_7_12_Pro"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.ilshat.trader712pro'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = '2.3.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSourceCommit' "$PLIST")" = "$(git rev-parse HEAD)"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/Trader_7_12 Pro.app' 'Trader_7_12_Pro_macOS.zip'

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trader_7_12_Pro_macOS
          path: Trader_7_12_Pro_macOS.zip
          if-no-files-found: error
