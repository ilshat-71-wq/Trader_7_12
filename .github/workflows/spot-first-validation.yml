name: SPOT-first validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spot-first-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Compile repository Python
        run: python -m compileall -q Program

      - name: Run full repository regression suite
        env:
          PYTHONPATH: Program
        run: python -m pytest -q Program
